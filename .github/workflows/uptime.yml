name: uptime

# Checks jklist.com every 10 minutes. When a run fails, GitHub emails the owner.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: jklist.com answers
        run: curl --fail --silent --show-error --max-time 20 --retry 3 --retry-delay 30 --retry-all-errors https://jklist.com/health
